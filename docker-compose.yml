###############################################################
# ECDAT — Enterprise Cryptographic Discovery & Assessment Tool
# Docker Compose — Full Stack (Local Dev + Production Mode)
###############################################################
# Usage:
#   Local Dev:    docker compose up
#   With Neon DB: DATABASE_URL=<neon_url> docker compose up
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
###############################################################

name: ecdat

services:
  # ─────────────────────────────────────────
  # Redis — Sessions, Rate Limiting, Cache
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecdat-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-ecdat-redis-secret}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ecdat-redis-secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecdat-net

  # ─────────────────────────────────────────
  # PostgreSQL — Local fallback (skip if using Neon)
  # Only starts when DATABASE_URL is not set to an external URL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ecdat-postgres
    restart: unless-stopped
    profiles: ["local-db"]  # Only runs with: docker compose --profile local-db up
    environment:
      POSTGRES_DB: ecdat_db
      POSTGRES_USER: ecdat_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecdat-local-secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecdat_user -d ecdat_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ecdat-net

  # ─────────────────────────────────────────
  # Backend — Node.js API Server
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecdat-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      # Database — Neon (preferred) or local Docker Postgres
      DATABASE_URL: ${DATABASE_URL:-postgresql://ecdat_user:ecdat-local-secret@postgres:5432/ecdat_db?sslmode=disable}
      DATA_STORE_MODE: postgres
      REQUIRE_DATABASE_HEALTH: "true"
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-ecdat-redis-secret}@redis:6379
      # Auth
      AUTH_MODE: ${AUTH_MODE:-demo}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-use-256bit-random}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://frontend}
      # Scanner
      SCAN_ARTIFACTS_DIR: /app/artifacts
      PYTHONPATH: /app
    ports:
      - "5000:5000"
    volumes:
      - scan_artifacts:/app/artifacts
      - ./rules:/app/rules:ro
    tmpfs:
      - /tmp:mode=1777,size=512m
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
      - seccomp:./docker/security/seccomp-profile.json
    privileged: false
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    pids_limit: 200
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - ecdat-net

  # ─────────────────────────────────────────
  # Frontend — Nginx + Vite Build
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: ecdat-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health-check"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
      - seccomp:./docker/security/seccomp-profile.json
    privileged: false
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 100
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    networks:
      - ecdat-net

# ─────────────────────────────────────────
# Named Volumes (persistent storage)
# ─────────────────────────────────────────
volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  scan_artifacts:
    driver: local

# ─────────────────────────────────────────
# Internal Network
# ─────────────────────────────────────────
networks:
  ecdat-net:
    driver: bridge
    name: ecdat-network
