apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecdat.fullname" . }}-frontend
  namespace: {{ .Values.global.controlPlaneNamespace }}
  labels:
    {{- include "ecdat.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "ecdat.name" . }}-frontend
spec:
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: {{ include "ecdat.name" . }}-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecdat.fullname" . }}-frontend
  namespace: {{ .Values.global.controlPlaneNamespace }}
  labels:
    {{- include "ecdat.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "ecdat.name" . }}-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ecdat.name" . }}-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ecdat.name" . }}-frontend
        ecdat.io/tier: control-plane
      annotations:
        container.apparmor.security.beta.kubernetes.io/frontend: runtime/default
    spec:
      serviceAccountName: {{ include "ecdat.fullname" . }}-frontend
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.frontend.securityContext | nindent 8 }}
      hostNetwork: false
      hostPID: false
      hostIPC: false
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: var-cache-nginx
              mountPath: /var/cache/nginx
            - name: var-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: var-cache-nginx
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: var-run
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
