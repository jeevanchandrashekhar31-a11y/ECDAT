apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecdat.fullname" . }}-backend
  namespace: {{ .Values.global.controlPlaneNamespace }}
  labels:
    {{- include "ecdat.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "ecdat.name" . }}-backend
spec:
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 5000
      name: http
  selector:
    app.kubernetes.io/name: {{ include "ecdat.name" . }}-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecdat.fullname" . }}-backend
  namespace: {{ .Values.global.controlPlaneNamespace }}
  labels:
    {{- include "ecdat.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "ecdat.name" . }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ecdat.name" . }}-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ecdat.name" . }}-backend
        ecdat.io/tier: control-plane
      annotations:
        container.apparmor.security.beta.kubernetes.io/backend: runtime/default
    spec:
      serviceAccountName: {{ include "ecdat.fullname" . }}-backend
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.backend.securityContext | nindent 8 }}
      hostNetwork: false
      hostPID: false
      hostIPC: false
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}{{ if .Values.backend.image.digest }}@{{ .Values.backend.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: TMPDIR
              value: "/tmp"
          ports:
            - containerPort: 5000
              name: http
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
