{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecdat.fullname" . }}-postgres
  namespace: {{ .Values.global.controlPlaneNamespace }}
  labels:
    {{- include "ecdat.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "ecdat.name" . }}-postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: {{ include "ecdat.name" . }}-postgres
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ecdat.fullname" . }}-postgres
  namespace: {{ .Values.global.controlPlaneNamespace }}
  labels:
    {{- include "ecdat.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "ecdat.name" . }}-postgres
spec:
  serviceName: {{ include "ecdat.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ecdat.name" . }}-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ecdat.name" . }}-postgres
    spec:
      securityContext:
        {{- toYaml .Values.postgres.securityContext | nindent 8 }}
      hostNetwork: false
      hostPID: false
      hostIPC: false
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}@{{ .Values.postgres.image.digest }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_DB
              value: "ecdat"
            - name: POSTGRES_USER
              value: "ecdat_app"
            - name: POSTGRES_PASSWORD
              value: "change-this-production-password"
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
