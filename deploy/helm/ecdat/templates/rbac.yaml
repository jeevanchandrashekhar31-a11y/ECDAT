{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ecdat.fullname" . }}-backend
  namespace: {{ .Values.global.controlPlaneNamespace }}
  labels:
    {{- include "ecdat.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ecdat.fullname" . }}-frontend
  namespace: {{ .Values.global.controlPlaneNamespace }}
  labels:
    {{- include "ecdat.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ecdat.fullname" . }}-scanner
  namespace: {{ .Values.global.controlPlaneNamespace }}
  labels:
    {{- include "ecdat.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ecdat.fullname" . }}-backend-role
  namespace: {{ .Values.global.controlPlaneNamespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ecdat.fullname" . }}-backend-rolebinding
  namespace: {{ .Values.global.controlPlaneNamespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ecdat.fullname" . }}-backend
    namespace: {{ .Values.global.controlPlaneNamespace }}
roleRef:
  kind: Role
  name: {{ include "ecdat.fullname" . }}-backend-role
  apiGroup: rbac.authorization.k8s.io
---
{{- if .Values.ebpfAgent.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ecdat.fullname" . }}-ebpf-agent
  namespace: {{ .Values.global.runtimeNamespace }}
  labels:
    {{- include "ecdat.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ecdat.fullname" . }}-ebpf-agent-clusterrole
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ecdat.fullname" . }}-ebpf-agent-clusterrolebinding
subjects:
  - kind: ServiceAccount
    name: {{ include "ecdat.fullname" . }}-ebpf-agent
    namespace: {{ .Values.global.runtimeNamespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "ecdat.fullname" . }}-ebpf-agent-clusterrole
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
