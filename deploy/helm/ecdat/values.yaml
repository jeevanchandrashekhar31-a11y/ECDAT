# ECDAT Production Hardened Helm Values (Phase 24.2)

global:
  controlPlaneNamespace: "ecdat-control-plane"
  runtimeNamespace: "ecdat-runtime"
  imagePullPolicy: IfNotPresent

# 1. Pod Security Standards
podSecurityStandards:
  controlPlane:
    enforce: "restricted"
    audit: "restricted"
    warn: "restricted"
  runtime:
    enforce: "privileged"
    audit: "privileged"
    warn: "privileged"

# 2. RBAC Configuration
rbac:
  create: true

# 3. NetworkPolicies
networkPolicies:
  enabled: true
  defaultDenyAll: true
  allowDnsEgress: true

# 4. Resource Quotas & Limits
resourceQuotas:
  enabled: true
  controlPlane:
    requestsCpu: "4"
    requestsMemory: "8Gi"
    limitsCpu: "8"
    limitsMemory: "16Gi"
    pods: "20"
  runtime:
    requestsCpu: "2"
    requestsMemory: "2Gi"
    limitsCpu: "4"
    limitsMemory: "4Gi"
    pods: "50"

# 5. Backend Configuration
backend:
  replicaCount: 2
  image:
    repository: ecdat/backend
    tag: "1.0.0"
    digest: "sha256:7f9a1c8b3e2d4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a"
  service:
    port: 5000
  resources:
    limits:
      cpu: "1000m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "128Mi"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

# 6. Frontend Configuration
frontend:
  replicaCount: 2
  image:
    repository: ecdat/frontend
    tag: "1.0.0"
    digest: "sha256:3a1b2c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b"
  service:
    port: 8080
  resources:
    limits:
      cpu: "500m"
      memory: "128Mi"
    requests:
      cpu: "100m"
      memory: "64Mi"
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

# 7. PostgreSQL Database Configuration
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    digest: "sha256:d8b2d131f4228943799cb3638421b8fbf4c68c6a0b271d47190d7ad824a7374b"
  storage:
    size: 10Gi
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "256Mi"
  securityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

# 8. Offline Scanner CronJob
scanner:
  enabled: true
  schedule: "0 2 * * *"
  image:
    repository: ecdat/scanner
    tag: "1.0.0"
    digest: "sha256:5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d"
  resources:
    limits:
      cpu: "1500m"
      memory: "1024Mi"
    requests:
      cpu: "500m"
      memory: "256Mi"

# 9. Isolated Runtime eBPF Agent DaemonSet (Separated from Control Plane)
ebpfAgent:
  enabled: true
  namespace: "ecdat-runtime"
  image:
    repository: ecdat/ebpf-agent
    tag: "1.0.0"
    digest: "sha256:9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8e"
  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "64Mi"
  securityContext:
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 10002
    runAsGroup: 10002
    fsGroup: 10002
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
      add:
        # 1. BPF: Required for bpf() syscall to load programs & maps
        - BPF
        # 2. PERFMON: Required for attaching uprobes without CAP_SYS_ADMIN
        - PERFMON
        # 3. SYS_RESOURCE: Required for RLIMIT_MEMLOCK on Linux 5.8-5.10
        - SYS_RESOURCE
