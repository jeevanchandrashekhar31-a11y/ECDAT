apiVersion: v1
kind: Service
metadata:
  name: ecdat-frontend
  namespace: ecdat-control-plane
  labels:
    app.kubernetes.io/name: ecdat-frontend
    app.kubernetes.io/part-of: ecdat
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: ecdat-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecdat-frontend
  namespace: ecdat-control-plane
  labels:
    app.kubernetes.io/name: ecdat-frontend
    app.kubernetes.io/part-of: ecdat
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ecdat-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecdat-frontend
        ecdat.io/tier: control-plane
      annotations:
        container.apparmor.security.beta.kubernetes.io/frontend: runtime/default
    spec:
      serviceAccountName: ecdat-frontend-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      hostNetwork: false
      hostPID: false
      hostIPC: false
      containers:
        - name: frontend
          image: ecdat/frontend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          resources:
            limits:
              cpu: "500m"
              memory: "128Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: var-cache-nginx
              mountPath: /var/cache/nginx
            - name: var-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: var-cache-nginx
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: var-run
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
