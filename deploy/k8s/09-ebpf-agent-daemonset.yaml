# Privileged Runtime eBPF Agent DaemonSet
# STRICT ARCHITECTURAL ISOLATION:
# Deployed exclusively into the isolated 'ecdat-runtime' namespace, completely
# segregated from the 'ecdat-control-plane' namespace.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ecdat-ebpf-agent
  namespace: ecdat-runtime
  labels:
    app.kubernetes.io/name: ecdat-ebpf-agent
    app.kubernetes.io/part-of: ecdat
    ecdat.io/tier: runtime-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ecdat-ebpf-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecdat-ebpf-agent
        ecdat.io/tier: runtime-agent
      annotations:
        container.apparmor.security.beta.kubernetes.io/ebpf-agent: runtime/default
    spec:
      serviceAccountName: ecdat-ebpf-agent-sa
      # hostPID is required to map in-kernel eBPF probe events to host process trees
      hostPID: true
      # hostNetwork is false: agent strictly uses Kubernetes SDN pod networking
      hostNetwork: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: ebpf-agent
          image: ecdat/ebpf-agent:1.0.0@sha256:9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8e
          imagePullPolicy: IfNotPresent
          # MINIMAL PRIVILEGE eBPF INSTRUMENTATION (Linux >= 5.8):
          # Privileged mode is strictly ELIMINATED. Container cannot access raw host devices.
          # allowPrivilegeEscalation is disabled to prevent setuid exploitation.
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                # 1. BPF: Authorizes bpf(BPF_PROG_LOAD) and bpf(BPF_MAP_CREATE) for ring buffers without CAP_SYS_ADMIN
                - BPF
                # 2. PERFMON: Authorizes perf event and uprobe attachment to user libraries (OpenSSL) without CAP_SYS_ADMIN
                - PERFMON
                # 3. SYS_RESOURCE: Authorizes raising RLIMIT_MEMLOCK on Linux 5.8-5.10 (cgroup memcg used on >= 5.11)
                - SYS_RESOURCE
                # NOTE: NET_ADMIN is strictly DROPPED: agent observes crypto uprobes, not network filters.
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CONTROL_PLANE_INGEST_URL
              value: "http://ecdat-backend.ecdat-control-plane.svc.cluster.local:5000/api/v1/telemetry/ebpf"
            - name: BPF_LOG_LEVEL
              value: "info"
            - name: BUFFER_SIZE_MB
              value: "16"
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            # Mount necessary kernel tracing and eBPF maps via HostToContainer (unprivileged-compatible)
            - name: bpf-fs
              mountPath: /sys/fs/bpf
              mountPropagation: HostToContainer
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: kernel-modules
              mountPath: /lib/modules
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: kernel-modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
