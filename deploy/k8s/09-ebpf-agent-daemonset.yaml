# Privileged Runtime eBPF Agent DaemonSet
# STRICT ARCHITECTURAL ISOLATION:
# Deployed exclusively into the isolated 'ecdat-runtime' namespace, completely
# segregated from the 'ecdat-control-plane' namespace.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ecdat-ebpf-agent
  namespace: ecdat-runtime
  labels:
    app.kubernetes.io/name: ecdat-ebpf-agent
    app.kubernetes.io/part-of: ecdat
    ecdat.io/tier: runtime-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ecdat-ebpf-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecdat-ebpf-agent
        ecdat.io/tier: runtime-agent
    spec:
      serviceAccountName: ecdat-ebpf-agent-sa
      # hostPID is required to map eBPF probe events to host process trees
      hostPID: true
      # hostNetwork is false: agent strictly uses Kubernetes SDN pod networking
      hostNetwork: false
      hostIPC: false
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: ebpf-agent
          image: ecdat/ebpf-agent:latest
          imagePullPolicy: IfNotPresent
          # Privileged capabilities scoped exclusively to eBPF kernel instrumentation
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - BPF
                - PERFMON
                - SYS_RESOURCE
                - NET_ADMIN
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CONTROL_PLANE_INGEST_URL
              value: "http://ecdat-backend.ecdat-control-plane.svc.cluster.local:5000/api/v1/telemetry/ebpf"
            - name: BPF_LOG_LEVEL
              value: "info"
            - name: BUFFER_SIZE_MB
              value: "16"
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            # Mount necessary kernel tracing and eBPF maps
            - name: bpf-fs
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: kernel-modules
              mountPath: /lib/modules
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: kernel-modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
