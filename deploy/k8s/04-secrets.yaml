# ECDAT Production Secret Specifications
# In production, these are managed via External Secrets Operator or HashiCorp Vault.
# Plaintext secrets must never be committed to Git.
# CONTAINS NO REAL SECRET VALUES: placeholders and external secret store references only.
apiVersion: v1
kind: Secret
metadata:
  name: ecdat-db-credentials
  namespace: ecdat-control-plane
  labels:
    app.kubernetes.io/part-of: ecdat
    ecdat.io/secret-tier: database
  annotations:
    secret.ecdat.io/managed-by: "external-secrets-operator"
    secret.ecdat.io/vault-path: "secret/data/ecdat/database"
    secret.ecdat.io/rotation-interval: "30d"
type: Opaque
data:
  # Base64 placeholders - replaced dynamically by Vault / ExternalSecrets in cluster
  username: UExBQ0VIT0xERVJfUkVQTEFDRURfQllfVkFVTFQ= # PLACEHOLDER_REPLACED_BY_VAULT
  password: UExBQ0VIT0xERVJfUkVQTEFDRURfQllfVkFVTFQ= # PLACEHOLDER_REPLACED_BY_VAULT
  database: UExBQ0VIT0xERVJfUkVQTEFDRURfQllfVkFVTFQ= # PLACEHOLDER_REPLACED_BY_VAULT
---
apiVersion: v1
kind: Secret
metadata:
  name: ecdat-secrets
  namespace: ecdat-control-plane
  labels:
    app.kubernetes.io/part-of: ecdat
    ecdat.io/secret-tier: application
  annotations:
    secret.ecdat.io/managed-by: "external-secrets-operator"
    secret.ecdat.io/vault-path: "secret/data/ecdat/application"
type: Opaque
data:
  api-key: UExBQ0VIT0xERVJfUkVQTEFDRURfQllfVkFVTFQ= # PLACEHOLDER_REPLACED_BY_VAULT
  jwt-secret: UExBQ0VIT0xERVJfUkVQTEFDRURfQllfVkFVTFQ= # PLACEHOLDER_REPLACED_BY_VAULT

